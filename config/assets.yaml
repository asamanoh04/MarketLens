# Activos monitoreados por MarketLens
# Para agregar uno nuevo: copia un bloque y cambia simbolo y nombre
# activo: false = lo descarga pero no lo analiza
# periodo = cuánto histórico bajar (max, 5y, 2y, 1y, etc.)

criptomonedas:
  - simbolo: BTC-USD
    nombre: Bitcoin
    activo: true
    periodo: max
    binance_simbolo: BTCUSDT

  - simbolo: ETH-USD
    nombre: Ethereum
    activo: true
    periodo: max
    binance_simbolo: ETHUSDT

  - simbolo: SOL-USD
    nombre: Solana
    activo: true
    periodo: max
    binance_simbolo: SOLUSDT

forex:
  - simbolo: EURUSD=X
    nombre: Euro / Dólar
    activo: true
    periodo: max

  - simbolo: MXN=X
    nombre: Peso / Dólar
    activo: true
    periodo: max

  - simbolo: JPY=X
    nombre: Dólar / Yen
    activo: true
    periodo: max

# acciones/indices: historial largo se baja a mano de Stooq (navegador)
# stooq_simbolo = qué buscar en stooq.com | archivo_manual = nombre del CSV
# que se descarga, debe quedar en data/raw/manual/
indices:
  - simbolo: SPY
    nombre: S&P 500 (ETF SPY)
    activo: true
    periodo: max
    stooq_simbolo: SPY.US
    archivo_manual: spy_us_d.csv

  - simbolo: QQQ
    nombre: NASDAQ (ETF QQQ)
    activo: true
    periodo: max
    stooq_simbolo: QQQ.US
    archivo_manual: qqq_us_d.csv

acciones:
  - simbolo: AAPL
    nombre: Apple
    activo: true
    periodo: max
    stooq_simbolo: AAPL.US
    archivo_manual: aapl_us_d.csv

  - simbolo: TSLA
    nombre: Tesla
    activo: true
    periodo: max
    stooq_simbolo: TSLA.US
    archivo_manual: tsla_us_d.csv
